<!DOCTYPE html>
<html lang="en">
<head>
<style>
  body {
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #f5f5f0;
    font-family: 'Georgia', serif;
  }

  .logo-container {
    text-align: center;
    opacity: 0;
    animation: fadeInUp 1.5s ease-out forwards;
  }

  .logo-icon {
    opacity: 0;
    transform: scale(0.5);
    animation: scaleIn 1s ease-out 0.3s forwards;
  }

  .logo-icon img {
    width: 500px;
    height: auto;
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(30px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes scaleIn {
    from { opacity: 0; transform: scale(0.5); }
    to   { opacity: 1; transform: scale(1); }
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(15px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<script>
    setTimeout(() => {
        window.location.href = "home.html";
    }, 3000);
</script>
<body>
  <div class="logo-container">
    <div class="logo-icon">
      <img src="/assets/logo.png" alt="Nava Nirmana Logo">
    </div>
  </div>
</body>
</html>
